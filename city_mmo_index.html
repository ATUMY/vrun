<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>City MMO Map</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081018;color:#fff;font-family:Arial,sans-serif}body{touch-action:none}
#app{width:100%;height:100%;position:relative;background:#0b141c}svg{position:absolute;width:100%;height:100%;inset:0}
.panel{position:absolute;z-index:5;background:rgba(8,15,22,.84);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 12px 35px #0006}
#top{top:12px;left:12px;right:12px;padding:11px 13px;display:flex;justify-content:space-between}.title{font-size:16px;font-weight:800}.sub{font-size:11px;opacity:.62;margin-top:3px}.badge{padding:7px 10px;border-radius:999px;background:#46dc8222;color:#8df0ae;font-size:11px}
#controls{left:12px;right:12px;bottom:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:12px 6px;background:#1a2935;color:white;font-weight:700;font-size:12px}button:active{transform:scale(.97)}.primary{background:#2677ff}.danger{background:#7d2632}
#routeInfo{left:12px;top:76px;padding:10px 12px;display:none}.route{fill:none;stroke:#65b7ff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}.road{fill:none;stroke:#273641;stroke-width:18;stroke-linecap:round}.road2{fill:none;stroke:#53626c;stroke-width:2;stroke-dasharray:10 9;opacity:.7}
.house{fill:#445b67;stroke:#728793}.building{fill:#344854;stroke:#627582}.tree{fill:#2f8b5c;stroke:#17553a}.label{font-size:9px;fill:#dfeaf2;pointer-events:none}.small{font-size:8px;fill:#9eb0bc}.poi{cursor:pointer}
#progress{position:absolute;z-index:6;left:12px;right:12px;bottom:78px;height:7px;border-radius:10px;background:#fff2;overflow:hidden;display:none}#bar{height:100%;width:0;background:#56a8ff}
#toast{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:13px;background:#000d;font-size:12px;display:none}
</style></head><body><div id="app">
<svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"><defs><filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grass" width="55" height="55" patternUnits="userSpaceOnUse"><rect width="55" height="55" fill="#182d25"/><path d="M7 45l4-7m8 12l3-7m21 1l4-7" stroke="#214638" stroke-width="2"/></pattern></defs>
<rect width="1000" height="700" fill="url(#grass)"/><path fill="#123c54" d="M760 0h240v700H850c-35-70-25-133-55-190-24-46-76-69-73-137 3-69 52-107 38-173z"/>
<g opacity=".45"><rect x="35" y="105" width="300" height="230" rx="25" fill="#243c35"/><rect x="360" y="105" width="350" height="230" rx="25" fill="#2c3541"/><rect x="60" y="365" width="300" height="260" rx="25" fill="#293a30"/><rect x="385" y="365" width="330" height="260" rx="25" fill="#3a3030"/></g>
<text x="55" y="132" class="small">ЖИЛОЙ РАЙОН</text><text x="385" y="132" class="small">ЦЕНТР</text><text x="80" y="392" class="small">ПАРКОВАЯ ЗОНА</text><text x="405" y="392" class="small">ПРОМЗОНА</text>
<g><path class="road" d="M80 180L300 180L470 270L690 180L865 220"/><path class="road2" d="M80 180L300 180L470 270L690 180L865 220"/><path class="road" d="M120 480L280 420L470 270L560 480L680 540L850 470"/><path class="road2" d="M120 480L280 420L470 270L560 480L680 540L850 470"/><path class="road" d="M280 180V420M470 270V610M690 180L680 540M560 480L850 220"/><path class="road2" d="M280 180V420M470 270V610M690 180L680 540M560 480L850 220"/></g>
<g><rect class="house" x="75" y="155" width="55" height="38" rx="4"/><rect class="house" x="145" y="155" width="55" height="38" rx="4"/><rect class="house" x="215" y="155" width="45" height="38" rx="4"/><rect class="house" x="90" y="215" width="60" height="42" rx="4"/><rect class="house" x="165" y="215" width="70" height="42" rx="4"/><rect class="house" x="80" y="285" width="70" height="35" rx="4"/><rect class="house" x="170" y="280" width="70" height="40" rx="4"/><rect class="building" x="390" y="155" width="65" height="55" rx="4"/><rect class="building" x="485" y="140" width="75" height="75" rx="4"/><rect class="building" x="590" y="150" width="70" height="60" rx="4"/></g>
<g><rect class="building" x="400" y="425" width="100" height="55" rx="5"/><rect class="building" x="520" y="410" width="95" height="70" rx="5"/><rect class="building" x="625" y="450" width="70" height="55" rx="5"/><rect class="building" x="405" y="515" width="85" height="65" rx="5"/><rect class="building" x="520" y="520" width="120" height="55" rx="5"/></g>
<g><circle cx="170" cy="490" r="90" fill="#1e543a" stroke="#39755a"/><circle class="tree" cx="120" cy="445" r="11"/><circle class="tree" cx="160" cy="425" r="10"/><circle class="tree" cx="210" cy="450" r="12"/><circle class="tree" cx="115" cy="510" r="12"/><circle class="tree" cx="180" cy="535" r="11"/><circle class="tree" cx="235" cy="505" r="10"/><path d="M110 500Q170 450 230 485" fill="none" stroke="#8b8061" stroke-width="5" stroke-linecap="round"/><text x="170" y="490" text-anchor="middle" class="label">ПАРК</text></g>
<g><rect x="780" y="90" width="145" height="80" rx="10" fill="#264a5d"/><path d="M800 105v55M835 105v55M870 105v55M905 105v55" stroke="#658b9e" stroke-width="5"/><path d="M770 180h150" stroke="#9a7b4f" stroke-width="8"/><text x="850" y="140" text-anchor="middle" class="label">ПОРТ</text></g>
<g class="poi" onclick="setA(280,180,'Магазин')"><circle cx="280" cy="180" r="18" fill="#d59a27"/><text x="280" y="185" text-anchor="middle" font-size="14">▣</text><text x="280" y="208" text-anchor="middle" class="label">МАГАЗИН</text></g>
<g class="poi" onclick="setA(470,270,'Площадь')"><circle cx="470" cy="270" r="22" fill="#2479ff"/><text x="470" y="276" text-anchor="middle" font-size="18">★</text><text x="470" y="305" text-anchor="middle" class="label">ПЛОЩАДЬ</text></g>
<g class="poi" onclick="setB(690,180,'Банк')"><circle cx="690" cy="180" r="18" fill="#5e7dff"/><text x="690" y="186" text-anchor="middle" font-size="14">$</text><text x="690" y="208" text-anchor="middle" class="label">БАНК</text></g>
<g class="poi" onclick="setB(680,540,'Больница')"><circle cx="680" cy="540" r="18" fill="#e85665"/><text x="680" y="546" text-anchor="middle" font-size="14">+</text><text x="680" y="568" text-anchor="middle" class="label">БОЛЬНИЦА</text></g>
<g class="poi" onclick="setB(850,470,'АЗС')"><circle cx="850" cy="470" r="18" fill="#d87536"/><text x="850" y="476" text-anchor="middle" font-size="13">⛽</text><text x="850" y="498" text-anchor="middle" class="label">АЗС</text></g>
<g class="poi" onclick="setB(560,480,'Завод')"><circle cx="560" cy="480" r="18" fill="#a15ce0"/><text x="560" y="485" text-anchor="middle" font-size="13">⚙</text><text x="560" y="510" text-anchor="middle" class="label">ЗАВОД</text></g>
<g class="poi" onclick="setB(850,220,'Порт')"><circle cx="850" cy="220" r="18" fill="#30a8c8"/><text x="850" y="225" text-anchor="middle" font-size="13">⚓</text><text x="850" y="248" text-anchor="middle" class="label">ПОРТ</text></g>
<circle id="markA" cx="280" cy="180" r="10" fill="#4cff91" stroke="#fff" stroke-width="3"/><text id="textA" x="280" y="160" text-anchor="middle" class="label">A</text><circle id="markB" cx="690" cy="180" r="10" fill="#ff5668" stroke="#fff" stroke-width="3"/><text id="textB" x="690" y="160" text-anchor="middle" class="label">B</text>
<path id="route" class="route" d=""/><g id="car" transform="translate(280 180)"><rect x="-15" y="-9" width="30" height="18" rx="6" fill="#f3f6fa" stroke="#111923" stroke-width="3"/><rect x="-7" y="-7" width="14" height="6" rx="2" fill="#4c7085"/><circle cx="-9" cy="9" r="4"/><circle cx="9" cy="9" r="4"/></g>
</svg>
<div id="top" class="panel"><div><div class="title">CITY MMO</div><div class="sub">Сервер 1 • Центральный город</div></div><div class="badge">● 128 онлайн</div></div>
<div id="routeInfo" class="panel"><b>Маршрут</b><div id="routeText" class="sub"></div></div><div id="progress"><div id="bar"></div></div>
<div id="controls" class="panel"><button onclick="buildRoute()">Построить</button><button class="primary" onclick="drive()">🚗 Поехать</button><button class="danger" onclick="resetRoute()">Сбросить</button></div><div id="toast"></div></div>
<script>
let A={x:280,y:180,name:'Магазин'},B={x:690,y:180,name:'Банк'},pts=[],driving=false;
const $=id=>document.getElementById(id),route=$('route'),car=$('car');
function marker(id,x,y){$(id).setAttribute('cx',x);$(id).setAttribute('cy',y);$(id==='markA'?'textA':'textB').setAttribute('x',x);$(id==='markA'?'textA':'textB').setAttribute('y',y-20)}
function setA(x,y,n){A={x,y,name:n};marker('markA',x,y);toast('Точка A: '+n)}
function setB(x,y,n){B={x,y,name:n};marker('markB',x,y);buildRoute();toast('Точка B: '+n)}
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1000)}
const N=[[80,180],[280,180],[470,270],[690,180],[865,220],[120,480],[280,420],[470,610],[560,480],[680,540],[850,470]];
const E=[[0,1],[1,2],[2,3],[3,4],[5,6],[6,2],[2,8],[8,9],[9,10],[2,7],[3,10],[6,1],[8,10]];
function path(a,b){let s=near(a),t=near(b),d=N.map(()=>1e99),p=N.map(()=>-1),u=N.map(()=>0),adj=N.map(()=>[]);for(let[e,f]of E){let w=Math.hypot(N[e][0]-N[f][0],N[e][1]-N[f][1]);adj[e].push([f,w]);adj[f].push([e,w])}d[s]=0;for(let k=0;k<N.length;k++){let v=-1;for(let i=0;i<N.length;i++)if(!u[i]&&(v<0||d[i]<d[v]))v=i;if(v<0)break;u[v]=1;for(let[z,w]of adj[v])if(d[v]+w<d[z]){d[z]=d[v]+w;p[z]=v}}let q=[],v=t;while(v>=0){q.unshift(N[v]);if(v===s)break;v=p[v]}q[0]=[a.x,a.y];q[q.length-1]=[b.x,b.y];return q}
function near(p){return N.reduce((bi,n,i)=>Math.hypot(n[0]-p.x,n[1]-p.y)<Math.hypot(N[bi][0]-p.x,N[bi][1]-p.y)?i:bi,0)}
function len(q){return q.reduce((s,p,i)=>i?s+Math.hypot(p[0]-q[i-1][0],p[1]-q[i-1][1]):0,0)}
function buildRoute(){pts=path(A,B);route.setAttribute('d',pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '));$('routeInfo').style.display='block';$('routeText').textContent=A.name+' → '+B.name+' • '+Math.round(len(pts))+' м'}
function drive(){if(driving)return;if(!pts.length)buildRoute();driving=true;$('progress').style.display='block';let total=len(pts),start=performance.now(),dur=Math.max(3500,total*9);function f(now){let q=Math.min(1,(now-start)/dur),target=total*q,acc=0,x=pts[0][0],y=pts[0][1],ang=0;for(let i=1;i<pts.length;i++){let dx=pts[i][0]-pts[i-1][0],dy=pts[i][1]-pts[i-1][1],l=Math.hypot(dx,dy);if(acc+l>=target){let t=(target-acc)/l;x=pts[i-1][0]+dx*t;y=pts[i-1][1]+dy*t;ang=Math.atan2(dy,dx)*180/Math.PI;break}acc+=l;x=pts[i][0];y=pts[i][1];ang=Math.atan2(dy,dx)*180/Math.PI}car.setAttribute('transform',`translate(${x} ${y}) rotate(${ang})`);$('bar').style.width=q*100+'%';if(q<1)requestAnimationFrame(f);else{driving=false;toast('Вы прибыли: '+B.name);setTimeout(()=>$('progress').style.display='none',500)}}requestAnimationFrame(f)}
function resetRoute(){driving=false;pts=[];route.setAttribute('d','');$('routeInfo').style.display='none';$('progress').style.display='none';car.setAttribute('transform',`translate(${A.x} ${A.y})`);toast('Маршрут сброшен')}
buildRoute();
</script></body></html>
