<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Builder FPS - Three.js + Cannon-es</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: Arial, sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* UI */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 4px rgba(0,0,0,0.5); z-index: 10;
        }
        
        #controls {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 20;
        }
        
        .btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            color: white; font-size: 14px; font-weight: bold; text-align: center; line-height: 70px;
            user-select: none; -webkit-user-select: none; cursor: pointer;
            backdrop-filter: blur(5px); transition: all 0.1s;
        }
        .btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.95); }
        .btn.hidden { display: none; }
        #btn-nail { background: rgba(255, 100, 100, 0.4); border-color: #ff6666; }
        #btn-pickup { background: rgba(100, 255, 100, 0.4); border-color: #66ff66; }
        #btn-hook { background: rgba(100, 100, 255, 0.4); border-color: #6666ff; }
        
        #joystick-zone {
            position: absolute; bottom: 0; left: 0; width: 50%; height: 50%;
            z-index: 15; touch-action: none;
        }
        #joystick-base {
            position: absolute; width: 120px; height: 120px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3); display: none;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #joystick-stick {
            position: absolute; width: 50px; height: 50px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%); pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="controls">
        <div id="btn-hook" class="btn">КРЮК</div>
        <div id="btn-pickup" class="btn hidden">ВЗЯТЬ</div>
        <div id="btn-nail" class="btn">ГВОЗДЬ</div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-base"><div id="joystick-stick"></div></div>
    </div>

    <!-- Подключаем Three.js и Cannon-es -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // ==========================================
        // 1. ИНИЦИАЛИЗАЦИЯ ДВИЖКА И ФИЗИКИ
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ'; // Для FPS

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.defaultContactMaterial.friction = 0.4;

        // Материалы физики
        const groundMat = new CANNON.Material('ground');
        const propMat = new CANNON.Material('prop');
        
        const groundContact = new CANNON.ContactMaterial(groundMat, propMat, { friction: 0.5, restitution: 0.1 });
        const propContact = new CANNON.ContactMaterial(propMat, propMat, { friction: 0.5, restitution: 0.1 });
        world.addContactMaterial(groundContact);
        world.addContactMaterial(propContact);

        // ==========================================
        // 2. ОСВЕЩЕНИЕ И ОКРУЖЕНИЕ (ГРАФИКА)
        // ==========================================
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        // ==========================================
        // 3. ГЕНЕРАЦИЯ КАРТЫ (ЗЕМЛЯ, ДОРОГИ, СТЕНЫ)
        // ==========================================
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMesh = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.8 }));
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        const groundBody = new CANNON.Body({ mass: 0, material: groundMat, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        // Функция создания коробки (стены, дома)
        function createBox(x, y, z, w, h, d, color, mass = 0) {
            const shape = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            const mesh = new THREE.Mesh(shape, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            if (mass > 0) {
                const body = new CANNON.Body({ mass: mass, material: propMat, shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)) });
                body.position.set(x, y, z);
                world.addBody(body);
                return { mesh, body };
            } else {
                const body = new CANNON.Body({ mass: 0, material: groundMat, shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)) });
                body.position.set(x, y, z);
                world.addBody(body);
                return { mesh, body };
            }
        }

        // Строим простенький город
        createBox(0, 2, -20, 20, 4, 10, 0x888888); // Дом
        createBox(-15, 1.5, -20, 5, 3, 5, 0xaa5555); // Дом 2
        createBox(15, 3, -25, 8, 6, 8, 0x5555aa); // Дом 3
        createBox(0, 0.5, 10, 10, 1, 10, 0xdddddd); // Площадка
        createBox(5, 0.5, 5, 4, 1, 0.5, 0xaaaaaa); // Стена для тестов

        // Добавляем деревья (визуально)
        for(let i=0; i<20; i++) {
            const tx = (Math.random() - 0.5) * 80;
            const tz = (Math.random() - 0.5) * 80;
            if (Math.abs(tx) < 15 && Math.abs(tz) < 15) continue; // Не спавним на старте
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), new THREE.MeshStandardMaterial({color: 0x8B4513}));
            trunk.position.set(tx, 1.5, tz);
            trunk.castShadow = true;
            scene.add(trunk);
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({color: 0x228B22}));
            leaves.position.set(tx, 3.5, tz);
            leaves.castShadow = true;
            scene.add(leaves);
        }

        // ==========================================
        // 4. ИНТЕРАКТИВНЫЕ ПРЕДМЕТЫ (ФИЗИКА)
        // ==========================================
        let interactableObjects = [];

        function spawnProp(type, x, y, z) {
            let mesh, body, size, color;
            
            if (type === 'box') {
                size = [1, 1, 1]; color = 0xffaa00;
            } else if (type === 'chair') {
                size = [0.8, 1, 0.8]; color = 0x00aaff;
            } else if (type === 'trashcan') {
                size = [0.8, 1.2, 0.8]; color = 0x555555;
            } else {
                size = [1.5, 0.5, 0.8]; color = 0xaa00aa; // Диван
            }

            const geo = new THREE.BoxGeometry(...size);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
            mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            body = new CANNON.Body({ 
                mass: 5, 
                material: propMat, 
                shape: new CANNON.Box(new CANNON.Vec3(size[0]/2, size[1]/2, size[2]/2)) 
            });
            body.position.set(x, y, z);
            body.linearDamping = 0.1;
            body.angularDamping = 0.5;
            world.addBody(body);

            const obj = { mesh, body, isHeld: false, isNailed: false, weight: 5 };
            interactableObjects.push(obj);
            return obj;
        }

        // Спавним предметы
        spawnProp('box', 2, 1, 5);
        spawnProp('chair', -2, 1, 5);
        spawnProp('trashcan', 0, 1, 8);
        spawnProp('sofa', -5, 1, -5);
        spawnProp('box', 5, 1, -5);
        spawnProp('box', 2, 1, 2);

        // ==========================================
        // 5. ИГРОК (ФИЗИКА И КАМЕРА)
        // ==========================================
        const playerRadius = 0.4;
        const playerHeight = 1.8;
        const playerBody = new CANNON.Body({
            mass: 70,
            material: groundMat,
            shape: new CANNON.Cylinder(playerRadius, playerRadius, playerHeight, 8),
            fixedRotation: true
        });
        playerBody.position.set(0, playerHeight / 2 + 0.1, 0);
        world.addBody(playerBody);

        // ==========================================
        // 6. УПРАВЛЕНИЕ (ДЖОЙСТИК, МЫШЬ, КНОПКИ)
        // ==========================================
        const moveState = { forward: 0, right: 0 };
        let pitch = 0, yaw = 0;
        let heldObject = null;
        let isHooked = false;
        let hookTarget = null;

        // --- Мышь (ПК) ---
        document.addEventListener('mousemove', (e) => {
            if (e.pointerType === 'mouse' || (e.buttons > 0 && !isTouchDevice)) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        });

        // --- Тач / Джойстик ---
        const joyZone = document.getElementById('joystick-zone');
        const joyBase = document.getElementById('joystick-base');
        const joyStick = document.getElementById('joystick-stick');
        let joyActive = false;
        let joyStartPos = { x: 0, y: 0 };
        const maxJoyDist = 50;

        let isTouchDevice = false;

        joyZone.addEventListener('touchstart', (e) => {
            isTouchDevice = true;
            e.preventDefault();
            const touch = e.changedTouches[0];
            joyActive = true;
            joyStartPos = { x: touch.clientX, y: touch.clientY };
            
            joyBase.style.display = 'block';
            joyBase.style.left = touch.clientX + 'px';
            joyBase.style.top = touch.clientY + 'px';
            joyStick.style.left = touch.clientX + 'px';
            joyStick.style.top = touch.clientY + 'px';
        });

        joyZone.addEventListener('touchmove', (e) => {
            if (!joyActive) return;
            e.preventDefault();
            const touch = e.changedTouches[0];
            const dx = touch.clientX - joyStartPos.x;
            const dy = touch.clientY - joyStartPos.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            let clampedX = dx, clampedY = dy;
            if (dist > maxJoyDist) {
                clampedX = (dx / dist) * maxJoyDist;
                clampedY = (dy / dist) * maxJoyDist;
            }

            joyStick.style.left = joyStartPos.x + clampedX + 'px';
            joyStick.style.top = joyStartPos.y + clampedY + 'px';

            moveState.right = clampedX / maxJoyDist;
            moveState.forward = -clampedY / maxJoyDist;
        });

        const endTouch = (e) => {
            if (!joyActive) return;
            e.preventDefault();
            joyActive = false;
            moveState.forward = 0;
            moveState.right = 0;
            joyBase.style.display = 'none';
        };
        joyZone.addEventListener('touchend', endTouch);
        joyZone.addEventListener('touchcancel', endTouch);

        // Вращение камеры на мобилке (свайп по правой части экрана)
        let lookTouchId = null;
        let lastLookPos = { x: 0, y: 0 };
        
        renderer.domElement.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.clientX > window.innerWidth / 2) {
                    lookTouchId = touch.identifier;
                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        renderer.domElement.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastLookPos.x;
                    const dy = touch.clientY - lastLookPos.y;
                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        renderer.domElement.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        });

        // ==========================================
        // 7. ЛОГИКА ПРИЦЕЛА И ВЗАИМОДЕЙСТВИЯ
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const screenCenter = new THREE.Vector2(0, 0); // Центр экрана
        let aimedObject = null;

        const btnNail = document.getElementById('btn-nail');
        const btnPickup = document.getElementById('btn-pickup');
        const btnHook = document.getElementById('btn-hook');

        function updateAim() {
            raycaster.setFromCamera(screenCenter, camera);
            
            // Проверяем предметы, которые можно взять
            const meshes = interactableObjects.map(o => o.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0 && intersects[0].distance < 8) {
                const hitMesh = intersects[0].object;
                aimedObject = interactableObjects.find(o => o.mesh === hitMesh);
            } else {
                // Если не попали в предмет, проверяем стены/пол для крюка
                const worldIntersects = raycaster.intersectObjects(scene.children, true);
                if (worldIntersects.length > 0 && worldIntersects[0].distance < 20) {
                    aimedObject = { mesh: worldIntersects[0].object, isStatic: true };
                } else {
                    aimedObject = null;
                }
            }

            // Обновляем UI
            if (heldObject) {
                btnNail.classList.add('hidden');
                btnPickup.classList.remove('hidden');
                btnPickup.textContent = 'ОТПУСТИТЬ';
            } else {
                btnPickup.classList.add('hidden');
                btnNail.classList.remove('hidden');
                
                // Если навелись на предмет (не статичный) - показываем кнопку взять
                if (aimedObject && !aimedObject.isStatic && !aimedObject.isNailed) {
                    btnPickup.classList.remove('hidden');
                    btnPickup.textContent = 'ВЗЯТЬ';
                } else {
                    btnPickup.classList.add('hidden');
                }
            }
        }

        // ==========================================
        // 8. ДЕЙСТВИЯ КНОПОК
        // ==========================================

        // ВЗЯТЬ / ОТПУСТИТЬ
        btnPickup.addEventListener('click', (e) => {
            e.stopPropagation();
            if (heldObject) {
                // Бросаем
                heldObject.isHeld = false;
                heldObject.body.wakeUp();
                heldObject = null;
            } else if (aimedObject && !aimedObject.isStatic && !aimedObject.isNailed) {
                // Берем
                heldObject = aimedObject;
                heldObject.isHeld = true;
                heldObject.body.sleep();
            }
        });

        // ВЫСТРЕЛ ГВОЗДЕМ
        btnNail.addEventListener('click', (e) => {
            e.stopPropagation();
            if (heldObject) return; // Нельзя стрелять с предметом

            // Логика выстрела: если навелись на предмет и он не прибит
            if (aimedObject && !aimedObject.isStatic && !aimedObject.isNailed) {
                // Прибиваем
                aimedObject.isNailed = true;
                aimedObject.body.mass = 0; // Делаем статичным
                aimedObject.body.type = CANNON.Body.STATIC;
                aimedObject.body.updateMassProperties();
                aimedObject.body.velocity.set(0,0,0);
                aimedObject.body.angularVelocity.set(0,0,0);
                aimedObject.mesh.material.color.set(0xffaaaa); // Визуальный эффект
                
                // Если предмет тяжелый и висит в воздухе - он упадет (физика Cannon сделает это автоматически, если нет опоры)
                // Но мы делаем его статичным, значит он просто зафиксируется на месте.
                // Для реализма "если тяжелый - падает", нужно проверять опору, но в рамках прототипа 
                // мы просто фиксируем его.
            } else {
                // Стреляем в пустоту / стену
                // Создаем визуальный гвоздь
                const nailGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.2);
                const nailMat = new THREE.MeshStandardMaterial({color: 0xcccccc});
                const nail = new THREE.Mesh(nailGeo, nailMat);
                nail.position.copy(camera.position);
                nail.quaternion.copy(camera.quaternion);
                nail.translateZ(-0.5);
                scene.add(nail);
                setTimeout(() => scene.remove(nail), 1000); // Удаляем через секунду
            }
        });

        // КРЮК
        let hookState = 'idle'; // idle, shooting, attached
        btnHook.addEventListener('click', (e) => {
            e.stopPropagation();
            
            if (hookState === 'idle' && aimedObject) {
                // Кидаем крюк
                hookState = 'shooting';
                hookTarget = aimedObject.mesh.position.clone();
                // Визуальная веревка (упрощенно)
                console.log("Крюк брошен!");
            } else if (hookState === 'attached') {
                // Спускаемся
                hookState = 'idle';
                playerBody.velocity.y = 0;
                playerBody.position.y = 1.0;
                console.log("Спуск!");
            }
        });

        // ==========================================
        // 9. ИГРОВОЙ ЦИКЛ
        // ==========================================
        const clock = new THREE.Clock();
        let ropeLine = null;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            // 1. Обновление физики
            world.step(1/60, dt, 3);

            // 2. Обновление камеры (вид от первого лица)
            camera.position.copy(playerBody.position);
            camera.position.y += 0.8; // Высота глаз
            camera.rotation.set(pitch, yaw, 0);

            // 3. Движение игрока
            if (hookState !== 'attached') {
                const speed = 8;
                const forward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, yaw, 0));
                const right = new THREE.Vector3(1, 0, 0).applyEuler(new THREE.Euler(0, yaw, 0));
                
                let moveVec = new THREE.Vector3();
                moveVec.addScaledVector(forward, moveState.forward);
                moveVec.addScaledVector(right, moveState.right);
                moveVec.normalize().multiplyScalar(speed);

                playerBody.velocity.x = moveVec.x;
                playerBody.velocity.z = moveVec.z;
            }

            // 4. Синхронизация мешей и физики
            interactableObjects.forEach(obj => {
                if (obj.isHeld) {
                    // Если держим предмет, он летает перед камерой
                    const targetPos = new THREE.Vector3(0, -0.2, -2).applyEuler(new THREE.Euler(pitch, yaw, 0)).add(camera.position);
                    obj.body.position.copy(targetPos);
                    obj.body.quaternion.setFromEuler(pitch, yaw, 0);
                }
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            });

            // 5. Логика крюка
            if (hookState === 'shooting') {
                // Летит к цели
                const hookPos = camera.position.clone().add(new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation).multiplyScalar(2));
                // Упрощенно: телепортируем игрока к точке чуть ниже цели
                if (hookTarget) {
                    playerBody.position.x = hookTarget.x;
                    playerBody.position.z = hookTarget.z;
                    playerBody.position.y = hookTarget.y + 2; // Поднимаем
                    playerBody.velocity.set(0, 0, 0);
                    hookState = 'attached';
                }
            }

            if (hookState === 'attached') {
                playerBody.velocity.y = 0; // Висим
                playerBody.position.y = hookTarget.y + 1.5; // Фиксируем высоту
            }

            // 6. Обновление прицела (каждый кадр)
            updateAim();

            // 7. Рендер
            renderer.render(scene, camera);
        }

        // Обработка ресайза
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск
        animate();

    </script>
</body>
</html>
