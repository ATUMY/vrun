<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 16px 30px;
      font-size: 18px;
      background: #2481cc;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button onclick="openChat()">💬 Чат</button>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function openChat() {
      tg.openTelegramLink("https://t.me/chat_mcpr");
    }
  </script>

</body>
</html>
