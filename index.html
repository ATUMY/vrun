<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лесной Апокалипсис</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a2e1a; font-family: 'Arial', sans-serif;
    touch-action: none; user-select: none;
  }
  #gameCanvas { display: block; position: absolute; top: 0; left: 0; }

  #ui { position: absolute; inset: 0; pointer-events: none; }

  #joystick {
    position: absolute; bottom: 30px; left: 30px;
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle, rgba(40,80,40,0.35), rgba(20,40,20,0.15));
    border: 2px solid rgba(120,200,120,0.35);
    display: none; pointer-events: none;
    box-shadow: 0 0 20px rgba(80,255,80,0.1), inset 0 0 30px rgba(0,0,0,0.3);
  }
  #joystickKnob {
    position: absolute; left: 50%; top: 50%;
    width: 55px; height: 55px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 35%, rgba(140,230,140,0.9), rgba(40,120,40,0.8));
    border: 2px solid rgba(180,255,180,0.6);
    box-shadow: 0 0 15px rgba(100,255,100,0.4);
  }

  #fireBtn {
    position: absolute; bottom: 40px; right: 40px;
    width: 100px; height: 100px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(220,80,60,0.85), rgba(140,20,20,0.75));
    border: 3px solid rgba(255,120,100,0.5);
    pointer-events: auto; touch-action: none;
    box-shadow: 0 0 20px rgba(255,60,40,0.35), inset 0 0 20px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: bold; letter-spacing: 1px;
    text-shadow: 0 1px 3px #000;
  }
  #fireBtn:active { transform: scale(0.95); }

  #weaponPanel {
    position: absolute; bottom: 155px; right: 40px;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: auto;
  }
  .weaponBtn {
    width: 55px; height: 55px; border-radius: 12px;
    background: rgba(20,40,20,0.7);
    border: 2px solid rgba(100,180,100,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
  }
  .weaponBtn.active {
    border-color: rgba(120,255,120,0.9);
    background: rgba(40,100,40,0.8);
    box-shadow: 0 0 18px rgba(80,255,80,0.5);
  }
  .weaponBtn:active { transform: scale(0.92); }

  /* Кнопка бессмертия */
  #godBtn {
    position: absolute; top: 15px; left: 15px;
    padding: 10px 16px; border-radius: 10px;
    background: rgba(20,40,60,0.75);
    border: 2px solid rgba(80,160,255,0.5);
    color: #cce6ff; font-size: 14px; font-weight: bold;
    pointer-events: auto; cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
    transition: all 0.15s;
  }
  #godBtn.on {
    background: rgba(40,120,220,0.85);
    border-color: rgba(150,220,255,1);
    color: #fff;
    box-shadow: 0 0 22px rgba(80,180,255,0.7);
  }
  #godBtn:active { transform: scale(0.95); }

  #hud {
    position: absolute; top: 15px; right: 15px;
    color: #cde;
    font-size: 16px; text-shadow: 0 2px 4px #000;
    text-align: right; line-height: 1.5;
  }
  #hud .ammo { font-size: 28px; font-weight: bold; color: #ffe; }

  #gameOver {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,0,0,0.75); color: #fcc;
    font-size: 42px; font-weight: bold; letter-spacing: 2px;
    pointer-events: auto; z-index: 10;
  }
  #gameOver small { font-size: 18px; color: #daa; margin-top: 10px; letter-spacing: 1px; }
  #restartBtn {
    margin-top: 30px; padding: 14px 36px; font-size: 20px;
    background: linear-gradient(180deg,#2a5a2a,#1a3a1a);
    border: 2px solid #6c6; border-radius: 12px; color: #cfc;
    cursor: pointer; letter-spacing: 1px;
  }
  #restartBtn:active { transform: scale(0.96); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="weaponPanel">
    <div class="weaponBtn active" data-w="pistol">🔫</div>
    <div class="weaponBtn" data-w="shotgun">💥</div>
    <div class="weaponBtn" data-w="mg">⚙️</div>
  </div>
  <div id="fireBtn">FIRE</div>
  <div id="godBtn">БЕССМЕРТИЕ (G)</div>
  <div id="hud">
    <div class="ammo" id="ammoDisplay">∞</div>
    <div id="weaponName">Пистолет</div>
    <div id="score">Убито: 0</div>
  </div>
  <div id="gameOver">
    ВЫ ПОГИБЛИ
    <small>Нажмите, чтобы начать заново</small>
    <button id="restartBtn">ЗАНОВО</button>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   КОНФИГ
============================================================ */
const CFG = {
  worldW: 3000, worldH: 3000,
  playerSpeed: 2.6,
  playerRadius: 16,
  joystickMax: 50,
  zombieCount: 14,
  zombieSpeed: 1.0,
  zombieRadius: 16,
  zombieHP: 3,
};

const WEAPONS = {
  pistol: {
    name: "Пистолет", icon: "🔫",
    damage: 1, fireRate: 260, spread: 0.04, pellets: 1,
    maxAngle: Math.PI/3,
    color: "#ffe37a", tracer: "#ffdd55", range: 700,
    auto: false,
  },
  shotgun: {
    name: "Дробовик", icon: "💥",
    damage: 1, fireRate: 750, spread: 0.22, pellets: 6,
    maxAngle: Math.PI/4,
    color: "#ff9944", tracer: "#ffaa44", range: 420,
    auto: false,
  },
  mg: {
    name: "Пулемёт", icon: "⚙️",
    damage: 1, fireRate: 95, spread: 0.09, pellets: 1,
    maxAngle: Math.PI/5,
    color: "#9fe0ff", tracer: "#aaddff", range: 800,
    auto: true,
  },
};
const WKEYS = Object.keys(WEAPONS);

/* ============================================================
   CANVAS
============================================================ */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let VW = 0, VH = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth;
  VH = window.innerHeight;
  canvas.width = VW * DPR;
  canvas.height = VH * DPR;
  canvas.style.width = VW + "px";
  canvas.style.height = VH + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  generateGroundTexture();
}
window.addEventListener("resize", resize);

/* ============================================================
   ГЕНЕРАЦИЯ МИРА
============================================================ */
let worldObjects = [];
let textureCanvas = null;

function seededRandom(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function generateWorld() {
  worldObjects = [];
  const rnd = seededRandom(1337);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * CFG.worldW;
    const y = rnd() * CFG.worldH;
    if (Math.hypot(x - CFG.worldW/2, y - CFG.worldH/2) < 200) continue;
    const type = rnd() < 0.6 ? "fir" : "dry";
    worldObjects.push({
      type, x, y,
      r: type === "fir" ? 22 + rnd()*14 : 16 + rnd()*10,
      seed: Math.floor(rnd()*10000),
      shade: rnd(),
    });
  }
  for (let i = 0; i < 120; i++) {
    worldObjects.push({
      type: "rock", x: rnd()*CFG.worldW, y: rnd()*CFG.worldH,
      r: 8 + rnd()*16, shade: rnd(),
    });
  }
  for (let i = 0; i < 40; i++) {
    worldObjects.push({
      type: "hill", x: rnd()*CFG.worldW, y: rnd()*CFG.worldH,
      r: 60 + rnd()*120, shade: rnd(),
    });
  }
  for (let i = 0; i < 400; i++) {
    worldObjects.push({
      type: "bush", x: rnd()*CFG.worldW, y: rnd()*CFG.worldH,
      r: 6 + rnd()*10, shade: rnd(),
    });
  }
  worldObjects.sort((a,b) => a.y - b.y);
}

function generateGroundTexture() {
  if (textureCanvas) return;
  const S = 512;
  textureCanvas = document.createElement("canvas");
  textureCanvas.width = S; textureCanvas.height = S;
  const tc = textureCanvas.getContext("2d");
  const grd = tc.createLinearGradient(0, 0, S, S);
  grd.addColorStop(0, "#2d4a1e");
  grd.addColorStop(0.5, "#35561f");
  grd.addColorStop(1, "#2a4519");
  tc.fillStyle = grd;
  tc.fillRect(0, 0, S, S);
  const rnd = seededRandom(99);
  for (let i = 0; i < 6000; i++) {
    const x = rnd()*S, y = rnd()*S;
    const a = rnd()*0.12;
    const g = 30 + rnd()*50;
    tc.fillStyle = `rgba(${Math.floor(g*0.6)},${Math.floor(g)},${Math.floor(g*0.4)},${a})`;
    tc.beginPath(); tc.arc(x, y, rnd()*3, 0, Math.PI*2); tc.fill();
  }
  for (let i = 0; i < 80; i++) {
    const x = rnd()*S, y = rnd()*S, r = 10+rnd()*40;
    const g = tc.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `rgba(60,100,40,${0.15+rnd()*0.1})`);
    g.addColorStop(1, "rgba(60,100,40,0)");
    tc.fillStyle = g;
    tc.beginPath(); tc.arc(x,y,r,0,Math.PI*2); tc.fill();
  }
}

/* ============================================================
   СОСТОЯНИЕ
============================================================ */
let player, zombies, bullets, particles, score, gameRunning, gameTime;
let camX = 0, camY = 0;
let godMode = false;

function resetGame() {
  player = {
    x: CFG.worldW/2, y: CFG.worldH/2,
    r: CFG.playerRadius,
    vx: 0, vy: 0,
    hp: 100,
    facing: 0,
    walkPhase: 0,
    isMoving: false,
  };
  zombies = [];
  bullets = [];
  particles = [];
  score = 0;
  gameTime = 0;
  gameRunning = true;
  for (let i = 0; i < CFG.zombieCount; i++) spawnZombie();
  updateAmmoUI();
  document.getElementById("score").textContent = "Убито: 0";
  document.getElementById("gameOver").style.display = "none";
}

function spawnZombie() {
  let x, y, tries = 0;
  do {
    const angle = Math.random() * Math.PI * 2;
    const dist = 500 + Math.random() * 600;
    x = player.x + Math.cos(angle) * dist;
    y = player.y + Math.sin(angle) * dist;
    x = Math.max(40, Math.min(CFG.worldW-40, x));
    y = Math.max(40, Math.min(CFG.worldH-40, y));
    tries++;
  } while (tries < 20 && Math.hypot(x-player.x, y-player.y) < 400);

  zombies.push({
    x, y, r: CFG.zombieRadius,
    hp: CFG.zombieHP,
    speed: CFG.zombieSpeed * (0.8 + Math.random()*0.5),
    wobble: Math.random()*Math.PI*2,
    walkPhase: Math.random()*Math.PI*2,
    facing: Math.random()*Math.PI*2,
    attackCd: 0,
    dead: false,
    skinTone: 0.7 + Math.random()*0.3,
    clothHue: 20 + Math.random()*40,
  });
}

/* ============================================================
   ВВОД
============================================================ */
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyG") toggleGod();
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

/* --- Бессмертие --- */
const godBtn = document.getElementById("godBtn");
function toggleGod() {
  godMode = !godMode;
  godBtn.classList.toggle("on", godMode);
  godBtn.textContent = godMode ? "БЕССМЕРТИЕ: ВКЛ (G)" : "БЕССМЕРТИЕ (G)";
}
godBtn.addEventListener("click", e => { e.stopPropagation(); toggleGod(); });
godBtn.addEventListener("touchstart", e => {
  e.preventDefault(); e.stopPropagation();
  toggleGod();
}, {passive:false});

/* --- Джойстик --- */
const joyEl = document.getElementById("joystick");
const joyKnob = document.getElementById("joystickKnob");
let joyActive = false, joyTouchId = null;
let joyCX = 0, joyCY = 0, joyDX = 0, joyDY = 0;

function joyStart(touch) {
  joyActive = true;
  joyTouchId = touch.identifier;
  joyDX = 0; joyDY = 0;
  joyEl.style.display = "block";
  const margin = 80;
  const jx = Math.max(margin, Math.min(touch.clientX, VW*0.45));
  const jy = Math.max(margin, Math.min(touch.clientY, VH - margin));
  joyEl.style.left = (jx - 65) + "px";
  joyEl.style.top = (jy - 65) + "px";
  joyEl.style.bottom = "auto";
  joyEl.style.right = "auto";
  joyCX = jx; joyCY = jy;
}
function joyMove(touch) {
  if (!joyActive || touch.identifier !== joyTouchId) return;
  let dx = touch.clientX - joyCX;
  let dy = touch.clientY - joyCY;
  const d = Math.hypot(dx, dy);
  if (d > CFG.joystickMax) {
    dx = dx / d * CFG.joystickMax;
    dy = dy / d * CFG.joystickMax;
  }
  joyDX = dx / CFG.joystickMax;
  joyDY = dy / CFG.joystickMax;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function joyEnd(touch) {
  if (touch.identifier !== joyTouchId) return;
  joyActive = false;
  joyTouchId = null;
  joyDX = 0; joyDY = 0;
  joyKnob.style.transform = "translate(-50%, -50%)";
  joyEl.style.display = "none";
}

/* --- Стрельба --- */
const fireBtn = document.getElementById("fireBtn");
let fireActive = false, fireTouchId = null;
let fireDX = 0, fireDY = 0, fireAimActive = false;
let fireStartX = 0, fireStartY = 0;
let mouseAim = false, mouseX = 0, mouseY = 0;
let mouseDown = false;
let currentWeaponIdx = 0;
let shootCooldown = 0;

function getWeapon() { return WEAPONS[WKEYS[currentWeaponIdx]]; }

function aimAngleFromScreen(sx, sy) {
  const px = player.x - camX;
  const py = player.y - camY;
  return Math.atan2(sy - py, sx - px);
}

function fireStart(sx, sy) {
  fireActive = true;
  fireStartX = sx; fireStartY = sy;
  fireDX = 0; fireDY = 0; fireAimActive = false;
  fireBtn.style.background = "radial-gradient(circle at 35% 35%, rgba(255,120,80,0.95), rgba(160,30,20,0.85))";
}
function fireMove(sx, sy) {
  if (!fireActive) return;
  let dx = sx - fireStartX;
  let dy = sy - fireStartY;
  const d = Math.hypot(dx, dy);
  if (d > 25) {
    fireAimActive = true;
    const maxD = 90;
    if (d > maxD) { dx = dx/d*maxD; dy = dy/d*maxD; }
    const w = getWeapon();
    let baseAngle = player.facing;
    let aim = Math.atan2(dy, dx);
    let diff = normalizeAngle(aim - baseAngle);
    if (Math.abs(diff) > w.maxAngle) {
      diff = Math.sign(diff) * w.maxAngle;
      aim = baseAngle + diff;
    }
    fireDX = Math.cos(aim);
    fireDY = Math.sin(aim);
  } else {
    fireAimActive = false;
  }
}
function fireEnd() {
  fireActive = false;
  fireBtn.style.background = "radial-gradient(circle at 35% 35%, rgba(220,80,60,0.85), rgba(140,20,20,0.75))";
  if (!fireAimActive) shoot(player.facing);
  else shoot(Math.atan2(fireDY, fireDX));
  fireAimActive = false;
  fireDX = 0; fireDY = 0;
}

function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI*2;
  while (a < -Math.PI) a += Math.PI*2;
  return a;
}

function handleTouchStart(e) {
  for (const t of e.changedTouches) {
    if (t.clientX < VW * 0.5 && t.clientY > VH * 0.45 && !joyActive) {
      joyStart(t); e.preventDefault();
    } else if (t.clientX > VW - 160 && t.clientY > VH - 180 && fireTouchId === null) {
      fireTouchId = t.identifier;
      fireStart(t.clientX, t.clientY);
      e.preventDefault();
    }
  }
}
function handleTouchMove(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) { joyMove(t); e.preventDefault(); }
    if (t.identifier === fireTouchId) { fireMove(t.clientX, t.clientY); e.preventDefault(); }
  }
}
function handleTouchEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) { joyEnd(t); e.preventDefault(); }
    if (t.identifier === fireTouchId) {
      fireTouchId = null; fireEnd(); e.preventDefault();
    }
  }
}
window.addEventListener("touchstart", handleTouchStart, {passive:false});
window.addEventListener("touchmove", handleTouchMove, {passive:false});
window.addEventListener("touchend", handleTouchEnd, {passive:false});
window.addEventListener("touchcancel", handleTouchEnd, {passive:false});

fireBtn.addEventListener("mousedown", e => { e.preventDefault(); fireStart(e.clientX, e.clientY); });
fireBtn.addEventListener("mousemove", e => { if (fireActive) fireMove(e.clientX, e.clientY); });
fireBtn.addEventListener("mouseup", e => { if (fireActive) fireEnd(); });
fireBtn.addEventListener("mouseleave", e => { if (fireActive) fireEnd(); });

canvas.addEventListener("mousemove", e => {
  mouseAim = true; mouseX = e.clientX; mouseY = e.clientY;
});
canvas.addEventListener("mousedown", e => {
  if (e.button === 0 && !fireActive) {
    mouseDown = true;
    shoot(aimAngleFromScreen(e.clientX, e.clientY));
  }
});
canvas.addEventListener("mouseup", () => { mouseDown = false; });

document.querySelectorAll(".weaponBtn").forEach((btn, i) => {
  btn.addEventListener("click", () => switchWeapon(i));
  btn.addEventListener("touchstart", e => {
    e.preventDefault(); e.stopPropagation();
    switchWeapon(i);
  }, {passive:false});
});
function switchWeapon(i) {
  currentWeaponIdx = i;
  document.querySelectorAll(".weaponBtn").forEach((b, j) => {
    b.classList.toggle("active", j === i);
  });
  updateAmmoUI();
}
function updateAmmoUI() {
  const w = getWeapon();
  document.getElementById("ammoDisplay").textContent = "∞";
  document.getElementById("weaponName").textContent = w.name;
}

/* ============================================================
   СТРЕЛЬБА
============================================================ */
function shoot(baseAngle) {
  if (shootCooldown > 0 || !gameRunning) return;
  const w = getWeapon();
  shootCooldown = w.fireRate / 1000;
  for (let p = 0; p < w.pellets; p++) {
    const a = baseAngle + (Math.random() - 0.5) * w.spread * 2;
    bullets.push({
      x: player.x + Math.cos(a) * (player.r + 6),
      y: player.y + Math.sin(a) * (player.r + 6),
      vx: Math.cos(a) * 14,
      vy: Math.sin(a) * 14,
      angle: a, life: w.range / 14,
      color: w.tracer, damage: w.damage,
      px: player.x, py: player.y,
    });
  }
  for (let i = 0; i < 5; i++) {
    const a = baseAngle + (Math.random()-0.5)*0.8;
    particles.push({
      x: player.x + Math.cos(a)*player.r,
      y: player.y + Math.sin(a)*player.r,
      vx: Math.cos(a)*(1+Math.random()*3),
      vy: Math.sin(a)*(1+Math.random()*3),
      life: 0.15 + Math.random()*0.15, maxLife: 0.3,
      color: w.color, r: 2 + Math.random()*3,
    });
  }
  player.facing = baseAngle;
}

/* ============================================================
   ОБНОВЛЕНИЕ
============================================================ */
function update(dt) {
  if (!gameRunning) return;
  gameTime += dt;
  if (shootCooldown > 0) shootCooldown -= dt;

  let mx = 0, my = 0;
  if (joyActive) { mx = joyDX; my = joyDY; }
  if (keys["KeyW"] || keys["ArrowUp"]) my -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) my += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }

  player.isMoving = ml > 0.1;
  if (player.isMoving) player.walkPhase += dt * 10;

  const spd = CFG.playerSpeed * 60 * dt;
  player.x += mx * spd;
  player.y += my * spd;
  player.x = Math.max(player.r, Math.min(CFG.worldW - player.r, player.x));
  player.y = Math.max(player.r, Math.min(CFG.worldH - player.r, player.y));

  if (ml > 0.1) {
    const moveAngle = Math.atan2(my, mx);
    let d = normalizeAngle(moveAngle - player.facing);
    player.facing += d * Math.min(1, dt * 12);
  }
  if (mouseAim && !joyActive && !fireAimActive) {
    const targetAngle = aimAngleFromScreen(mouseX, mouseY);
    let d = normalizeAngle(targetAngle - player.facing);
    player.facing += d * Math.min(1, dt * 15);
  }
  if (fireAimActive) {
    const targetAngle = Math.atan2(fireDY, fireDX);
    let d = normalizeAngle(targetAngle - player.facing);
    player.facing += d * Math.min(1, dt * 20);
  }

  if (fireActive && fireAimActive && getWeapon().auto) {
    shoot(Math.atan2(fireDY, fireDX));
  } else if (fireActive && !fireAimActive && getWeapon().auto && Math.hypot(joyDX,joyDY) < 0.1 && !mouseAim) {
    shoot(player.facing);
  }
  if (mouseDown) shoot(aimAngleFromScreen(mouseX, mouseY));

  /* --- Пули --- */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx * 60 * dt;
    b.y += b.vy * 60 * dt;
    b.life -= 60 * dt;
    let hit = false;
    for (const z of zombies) {
      if (z.dead) continue;
      const d = Math.hypot(b.x - z.x, b.y - z.y);
      if (d < z.r + 4) {
        z.hp -= b.damage;
        for (let k = 0; k < 8; k++) {
          particles.push({
            x: b.x, y: b.y,
            vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
            life: 0.3 + Math.random()*0.3, maxLife: 0.6,
            color: "#8b1a1a", r: 2 + Math.random()*3,
          });
        }
        if (z.hp <= 0) {
          z.dead = true; score++;
          document.getElementById("score").textContent = "Убито: " + score;
          for (let k = 0; k < 20; k++) {
            particles.push({
              x: z.x, y: z.y,
              vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
              life: 0.4 + Math.random()*0.5, maxLife: 0.9,
              color: Math.random() < 0.5 ? "#4a0a0a" : "#6b1a1a",
              r: 3 + Math.random()*4,
            });
          }
        }
        hit = true; break;
      }
    }
    if (!hit) {
      for (const o of worldObjects) {
        if (o.type === "fir" || o.type === "rock" || o.type === "dry") {
          const d = Math.hypot(b.x - o.x, b.y - o.y);
          if (d < o.r * 0.7) { hit = true; break; }
        }
      }
    }
    if (hit || b.life <= 0 || b.x < 0 || b.y < 0 || b.x > CFG.worldW || b.y > CFG.worldH) {
      bullets.splice(i, 1);
    }
  }

  /* --- Зомби --- */
  for (const z of zombies) {
    if (z.dead) continue;
    z.wobble += dt * 5;
    const dx = player.x - z.x;
    const dy = player.y - z.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.1) {
      const wob = Math.sin(z.wobble) * 0.3;
      const spdZ = z.speed * 60 * dt;
      z.x += (dx/dist) * spdZ + Math.cos(z.wobble) * wob * dt * 10;
      z.y += (dy/dist) * spdZ + Math.sin(z.wobble) * wob * dt * 10;
      // плавный поворот зомби к игроку
      const targetFace = Math.atan2(dy, dx);
      let df = normalizeAngle(targetFace - z.facing);
      z.facing += df * Math.min(1, dt * 4);
      z.walkPhase += dt * 6;
    }
    if (dist < z.r + player.r) {
      if (!godMode) {
        player.hp -= 12 * dt;
        if (player.hp <= 0) { player.hp = 0; gameOver(); }
      }
    }
    for (const z2 of zombies) {
      if (z2 === z || z2.dead) continue;
      const ddx = z.x - z2.x, ddy = z.y - z2.y;
      const dd = Math.hypot(ddx, ddy);
      if (dd < z.r + z2.r && dd > 0.1) {
        const push = (z.r + z2.r - dd) * 0.5;
        z.x += (ddx/dd) * push;
        z.y += (ddy/dd) * push;
      }
    }
    z.x = Math.max(z.r, Math.min(CFG.worldW - z.r, z.x));
    z.y = Math.max(z.r, Math.min(CFG.worldH - z.r, z.y));
  }
  for (let i = zombies.length - 1; i >= 0; i--) {
    if (zombies[i].dead) zombies.splice(i, 1);
  }
  while (zombies.length < CFG.zombieCount && gameRunning) spawnZombie();

  /* --- Частицы --- */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * 60 * dt;
    p.y += p.vy * 60 * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  /* --- Камера --- */
  const targetCamX = player.x - VW/2;
  const targetCamY = player.y - VH/2;
  camX += (targetCamX - camX) * Math.min(1, dt * 8);
  camY += (targetCamY - camY) * Math.min(1, dt * 8);
  camX = Math.max(0, Math.min(CFG.worldW - VW, camX));
  camY = Math.max(0, Math.min(CFG.worldH - VH, camY));
}

function gameOver() {
  if (godMode) return;
  gameRunning = false;
  document.getElementById("gameOver").style.display = "flex";
}

/* ============================================================
   ОТРИСОВКА
============================================================ */
function draw() {
  ctx.fillStyle = "#152310";
  ctx.fillRect(0, 0, VW, VH);

  if (textureCanvas) {
    const pat = ctx.createPattern(textureCanvas, "repeat");
    ctx.save();
    ctx.translate(-camX, -camY);
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, CFG.worldW, CFG.worldH);
    ctx.restore();
  }

  ctx.save();
  ctx.translate(-camX, -camY);
  ctx.strokeStyle = "rgba(20,40,15,0.8)";
  ctx.lineWidth = 40;
  ctx.strokeRect(-20, -20, CFG.worldW+40, CFG.worldH+40);

  for (const o of worldObjects) {
    if (o.x + o.r + 50 < camX || o.x - o.r - 50 > camX + VW ||
        o.y + o.r + 50 < camY || o.y - o.r - 50 > camY + VH) continue;
    if (o.type === "hill") {
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      g.addColorStop(0, "rgba(70,110,45,0.35)");
      g.addColorStop(0.7, "rgba(60,95,40,0.2)");
      g.addColorStop(1, "rgba(50,80,35,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, o.r, o.r*0.55, 0, 0, Math.PI*2);
      ctx.fill();
    } else if (o.type === "bush") {
      const g = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.3, 0, o.x, o.y, o.r);
      g.addColorStop(0, `rgba(${60+o.shade*40|0},${130+o.shade*50|0},${50+o.shade*30|0},0.9)`);
      g.addColorStop(1, "rgba(30,70,25,0.6)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
      ctx.fill();
    } else if (o.type === "rock") {
      const g = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.4, o.r*0.1, o.x, o.y, o.r);
      const base = 90 + o.shade*50;
      g.addColorStop(0, `rgb(${base+40|0},${base+40|0},${base+35|0})`);
      g.addColorStop(0.6, `rgb(${base|0},${base|0},${base-5|0})`);
      g.addColorStop(1, `rgb(${base-40|0},${base-40|0},${base-45|0})`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, o.r, o.r*0.8, o.shade*3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.beginPath();
      ctx.ellipse(o.x - o.r*0.25, o.y - o.r*0.3, o.r*0.3, o.r*0.2, -0.5, 0, Math.PI*2);
      ctx.fill();
    } else if (o.type === "fir") {
      drawFir(o);
    } else if (o.type === "dry") {
      drawDryTree(o);
    }
  }

  for (const z of zombies) {
    if (z.x + z.r + 60 < camX || z.x - z.r - 60 > camX + VW ||
        z.y + z.r + 60 < camY || z.y - z.r - 60 > camY + VH) continue;
    drawZombie(z);
  }

  drawPlayer();

  for (const b of bullets) {
    const tailX = b.x - b.vx * 1.5;
    const tailY = b.y - b.vy * 1.5;
    const g = ctx.createLinearGradient(tailX, tailY, b.x, b.y);
    g.addColorStop(0, "rgba(255,255,200,0)");
    g.addColorStop(0.5, b.color);
    g.addColorStop(1, "#ffffff");
    ctx.strokeStyle = g;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2);
    ctx.fill();
  }

  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (fireAimActive && fireActive) {
    const w = getWeapon();
    const sx = player.x, sy = player.y;
    const len = 300;
    const aimA = Math.atan2(fireDY, fireDX);
    const ex = sx + Math.cos(aimA) * len;
    const ey = sy + Math.sin(aimA) * len;
    ctx.save();
    ctx.strokeStyle = "rgba(80,255,80,0.6)";
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
    const baseA = player.facing;
    ctx.strokeStyle = "rgba(80,255,80,0.15)";
    ctx.lineWidth = 2;
    for (const sign of [-1, 1]) {
      const a = baseA + sign * w.maxAngle;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(a) * len, sy + Math.sin(a) * len);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(80,255,80,0.8)";
    ctx.beginPath();
    ctx.arc(ex, ey, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  /* --- HP --- */
  const hpW = 180, hpH = 14;
  const hpX = 15, hpY = 15;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(hpX-2, hpY-2, hpW+4, hpH+4);
  ctx.fillStyle = "#331111";
  ctx.fillRect(hpX, hpY, hpW, hpH);
  const hpFrac = Math.max(0, player.hp / 100);
  const hpGrad = ctx.createLinearGradient(hpX, 0, hpX+hpW, 0);
  if (godMode) {
    hpGrad.addColorStop(0, "#33aaff");
    hpGrad.addColorStop(1, "#88ddff");
  } else {
    hpGrad.addColorStop(0, "#e04040");
    hpGrad.addColorStop(1, "#ff8888");
  }
  ctx.fillStyle = hpGrad;
  ctx.fillRect(hpX, hpY, hpW * hpFrac, hpH);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";
  ctx.fillText(
    godMode ? "∞ БЕССМЕРТИЕ ∞" : "HP " + Math.ceil(player.hp),
    hpX + hpW/2, hpY + hpH - 3
  );

  drawMinimap();
}

function drawFir(o) {
  const {x, y, r, shade} = o;
  ctx.fillStyle = "#3a2a15";
  ctx.fillRect(x - 3, y - 2, 6, r * 0.5);
  const layers = 3;
  for (let i = 0; i < layers; i++) {
    const ly = y - i * r * 0.6;
    const lw = r * (1 - i * 0.25);
    const lh = r * 0.9;
    const g = ctx.createLinearGradient(x - lw, ly - lh, x + lw, ly);
    g.addColorStop(0, `rgb(${20+shade*20|0},${70+shade*40|0},${30+shade*20|0})`);
    g.addColorStop(0.5, `rgb(${35+shade*30|0},${110+shade*50|0},${40+shade*25|0})`);
    g.addColorStop(1, `rgb(${15+shade*15|0},${55+shade*30|0},${20+shade*15|0})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, ly - lh);
    ctx.lineTo(x - lw, ly);
    ctx.lineTo(x + lw, ly);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(10,30,10,0.3)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawDryTree(o) {
  const {x, y, r, shade} = o;
  const g = ctx.createLinearGradient(x - r*0.5, y, x + r*0.5, y);
  g.addColorStop(0, "#2a1a0a");
  g.addColorStop(0.5, `rgb(${80+shade*30|0},${60+shade*20|0},${35+shade*15|0})`);
  g.addColorStop(1, "#1f1205");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - r*0.18, y + r*0.3);
  ctx.lineTo(x - r*0.12, y - r*0.9);
  ctx.lineTo(x + r*0.12, y - r*0.9);
  ctx.lineTo(x + r*0.18, y + r*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = `rgb(${70+shade*20|0},${50+shade*15|0},${30+shade*10|0})`;
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  for (let i = 0; i < 4; i++) {
    const by = y - r * (0.3 + i*0.18);
    const dir = i % 2 === 0 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(x, by);
    ctx.lineTo(x + dir * r * 0.7, by - r * 0.35);
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x + dir * r * 0.4, by - r*0.18);
    ctx.lineTo(x + dir * r * 0.65, by - r * 0.45);
    ctx.stroke();
    ctx.lineWidth = 2.5;
  }
}

/* ============================================================
   РЕАЛИСТИЧНЫЙ ЗОМБИ (вид сверху)
============================================================ */
function drawZombie(z) {
  const {x, y, r, facing} = z;
  const skin = z.skinTone;
  const step = Math.sin(z.walkPhase);
  const rS = r; // масштаб

  // Тень под телом
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 4, rS*1.0, rS*0.75, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Поворачиваем вокруг центра для отрисовки "человека"
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(facing + Math.PI/2); // 0 = вверх

  // ----- Ноги (видны чуть с боков, шагают) -----
  const legSwing = step * 4;
  drawLimbPart(-rS*0.35, rS*0.55 + legSwing, rS*0.28, rS*0.7,
               `rgb(${30},${20},${10})`, `rgb(${50*z.clothHue/60|0},${40*z.clothHue/60|0},${20})`);
  drawLimbPart(rS*0.35, rS*0.55 - legSwing, rS*0.28, rS*0.7,
               `rgb(${30},${20},${10})`, `rgb(${50*z.clothHue/60|0},${40*z.clothHue/60|0},${20})`);

  // ----- Торс (куртка/рваная одежда) -----
  const torsoGrad = ctx.createLinearGradient(-rS, -rS*0.6, rS, rS*0.6);
  const hue = z.clothHue;
  torsoGrad.addColorStop(0, `rgb(${Math.floor(60+hue*0.8)},${Math.floor(50+hue*0.6)},${Math.floor(40+hue*0.4)})`);
  torsoGrad.addColorStop(0.5, `rgb(${Math.floor(80+hue)},${Math.floor(65+hue*0.7)},${Math.floor(45+hue*0.5)})`);
  torsoGrad.addColorStop(1, `rgb(${Math.floor(45+hue*0.6)},${Math.floor(35+hue*0.4)},${Math.floor(25+hue*0.3)})`);
  ctx.fillStyle = torsoGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, rS*0.85, rS*0.75, 0, 0, Math.PI*2);
  ctx.fill();
  // тёмный контур
  ctx.strokeStyle = "rgba(20,15,10,0.7)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Пятна грязи/крови на торсе
  ctx.fillStyle = "rgba(80,10,10,0.5)";
  ctx.beginPath();
  ctx.ellipse(-rS*0.25, rS*0.15, rS*0.22, rS*0.15, 0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(rS*0.3, -rS*0.1, rS*0.15, rS*0.1, -0.3, 0, Math.PI*2);
  ctx.fill();

  // ----- Руки (вытянуты вперёд, зомби-стиль) -----
  const armReach = rS * 1.05;
  const armWob = Math.sin(z.wobble) * rS * 0.08;
  for (const side of [-1, 1]) {
    const ax = side * rS * 0.75;
    const ay = -rS * 0.1;
    // плечо
    ctx.strokeStyle = `rgb(${Math.floor(60+hue*0.6)},${Math.floor(50+hue*0.4)},${Math.floor(40+hue*0.3)})`;
    ctx.lineWidth = rS * 0.28;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax * 0.7, ay - armReach * 0.55 + armWob * side);
    ctx.stroke();
    // предплечье (бледная кожа)
    ctx.strokeStyle = `rgb(${Math.floor(120*skin)},${Math.floor(140*skin)},${Math.floor(100*skin)})`;
    ctx.lineWidth = rS * 0.22;
    ctx.beginPath();
    ctx.moveTo(ax * 0.7, ay - armReach * 0.55 + armWob * side);
    ctx.lineTo(ax * 0.45, ay - armReach * 0.95 + armWob * side);
    ctx.stroke();
    // кисть
    ctx.fillStyle = `rgb(${Math.floor(120*skin)},${Math.floor(140*skin)},${Math.floor(100*skin)})`;
    ctx.beginPath();
    ctx.arc(ax * 0.45, ay - armReach * 0.98 + armWob * side, rS * 0.14, 0, Math.PI*2);
    ctx.fill();
    // тёмные пальцы
    ctx.strokeStyle = "rgba(40,50,30,0.9)";
    ctx.lineWidth = 1.5;
    for (let fi = 0; fi < 3; fi++) {
      ctx.beginPath();
      ctx.moveTo(ax*0.45 + (fi-1)*3, ay - armReach*1.02 + armWob*side);
      ctx.lineTo(ax*0.45 + (fi-1)*3.5, ay - armReach*1.15 + armWob*side);
      ctx.stroke();
    }
  }

  // ----- Голова -----
  const headR = rS * 0.55;
  const headY = -rS * 0.15;
  // волосы (тёмные, растрёпанные)
  ctx.fillStyle = `rgb(${20+Math.floor(skin*10)},${15+Math.floor(skin*8)},${10})`;
  ctx.beginPath();
  ctx.arc(0, headY - 1, headR * 1.05, 0, Math.PI*2);
  ctx.fill();
  // лицо
  const faceGrad = ctx.createRadialGradient(-headR*0.25, headY - headR*0.3, headR*0.1, 0, headY, headR);
  faceGrad.addColorStop(0, `rgb(${Math.floor(150*skin)},${Math.floor(170*skin)},${Math.floor(130*skin)})`);
  faceGrad.addColorStop(0.6, `rgb(${Math.floor(110*skin)},${Math.floor(125*skin)},${Math.floor(90*skin)})`);
  faceGrad.addColorStop(1, `rgb(${Math.floor(70*skin)},${Math.floor(80*skin)},${Math.floor(55*skin)})`);
  ctx.fillStyle = faceGrad;
  ctx.beginPath();
  ctx.arc(0, headY, headR, 0, Math.PI*2);
  ctx.fill();
  // тень под подбородком
  ctx.fillStyle = "rgba(30,25,15,0.35)";
  ctx.beginPath();
  ctx.ellipse(0, headY + headR*0.6, headR*0.7, headR*0.25, 0, 0, Math.PI*2);
  ctx.fill();

  // Глаза (тёмные впадины)
  ctx.fillStyle = "rgba(15,10,10,0.9)";
  ctx.beginPath();
  ctx.ellipse(-headR*0.35, headY - headR*0.15, headR*0.2, headR*0.15, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(headR*0.35, headY - headR*0.15, headR*0.2, headR*0.15, 0, 0, Math.PI*2);
  ctx.fill();
  // Красные светящиеся зрачки
  const eyeGlow = 0.7 + Math.sin(gameTime * 4 + z.wobble) * 0.3;
  ctx.fillStyle = `rgba(255,40,20,${eyeGlow})`;
  ctx.beginPath();
  ctx.arc(-headR*0.35, headY - headR*0.15, headR*0.08, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(headR*0.35, headY - headR*0.15, headR*0.08, 0, Math.PI*2);
  ctx.fill();

  // Рот (открытый, тёмный)
  ctx.fillStyle = "rgba(20,10,10,0.85)";
  ctx.beginPath();
  ctx.ellipse(0, headY + headR*0.3, headR*0.22, headR*0.13, 0, 0, Math.PI*2);
  ctx.fill();
  // зубы
  ctx.fillStyle = "rgba(200,190,150,0.8)";
  for (let ti = -1; ti <= 1; ti++) {
    ctx.fillRect(ti * headR*0.12 - 1, headY + headR*0.22, 2, headR*0.08);
  }

  // Кровь на лице
  ctx.fillStyle = "rgba(120,10,10,0.55)";
  ctx.beginPath();
  ctx.ellipse(headR*0.5, headY + headR*0.1, headR*0.1, headR*0.25, 0.3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();

  // HP бар
  if (z.hp < CFG.zombieHP) {
    const bw = r*2, bh = 4;
    const bx = x - r, by = y - r - 12;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    ctx.fillStyle = "#8a1a1a";
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "#ff3333";
    ctx.fillRect(bx, by, bw * (z.hp / CFG.zombieHP), bh);
  }
}

function drawLimbPart(x, y, w, h, strokeColor, fillColor) {
  ctx.fillStyle = fillColor;
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, y, w, h, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
}

/* ============================================================
   РЕАЛИСТИЧНЫЙ ИГРОК (вид сверху)
============================================================ */
function drawPlayer() {
  const {x, y, r, facing, walkPhase, isMoving} = player;
  const step = isMoving ? Math.sin(walkPhase) : 0;

  // Тень
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 5, r*1.0, r*0.8, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(facing + Math.PI/2);

  // ----- Ноги -----
  const legSwing = step * 4;
  // левая нога
  ctx.fillStyle = "#2a3a4a";
  ctx.beginPath();
  ctx.ellipse(-r*0.35, r*0.55 + legSwing, r*0.28, r*0.72, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // правая нога
  ctx.fillStyle = "#2a3a4a";
  ctx.beginPath();
  ctx.ellipse(r*0.35, r*0.55 - legSwing, r*0.28, r*0.72, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  // ботинки
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath();
  ctx.ellipse(-r*0.35, r*0.9 + legSwing, r*0.3, r*0.35, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(r*0.35, r*0.9 - legSwing, r*0.3, r*0.35, 0, 0, Math.PI*2);
  ctx.fill();

  // ----- Торс (тактическая куртка) -----
  const bodyGrad = ctx.createLinearGradient(-r, -r*0.6, r, r*0.6);
  bodyGrad.addColorStop(0, "#2a5a3a");
  bodyGrad.addColorStop(0.5, "#3d7a4d");
  bodyGrad.addColorStop(1, "#1e4228");
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, r*0.9, r*0.8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = "rgba(10,25,15,0.7)";
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // Разгрузочный жилет (тёмный ремень)
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-r*0.6, -r*0.2);
  ctx.lineTo(-r*0.5, r*0.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(r*0.6, -r*0.2);
  ctx.lineTo(r*0.5, r*0.5);
  ctx.stroke();

  // Ремень через грудь
  ctx.strokeStyle = "#3a2a1a";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-r*0.7, -r*0.3);
  ctx.lineTo(r*0.7, r*0.3);
  ctx.stroke();

  // ----- Руки -----
  // левая рука (сзади, держит оружие)
  const armReach = r * 0.95;
  // левое плечо
  ctx.strokeStyle = "#2d5d3d";
  ctx.lineWidth = r * 0.32;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-r*0.75, -r*0.1);
  ctx.lineTo(-r*0.6, -armReach*0.55);
  ctx.stroke();
  // левое предплечье (направлено вперёд к оружию)
  ctx.strokeStyle = "#3d7a4d";
  ctx.lineWidth = r * 0.26;
  ctx.beginPath();
  ctx.moveTo(-r*0.6, -armReach*0.55);
  ctx.lineTo(-r*0.15, -armReach*0.95);
  ctx.stroke();
  // левая кисть
  ctx.fillStyle = "#c8a888";
  ctx.beginPath();
  ctx.arc(-r*0.15, -armReach*0.98, r*0.17, 0, Math.PI*2);
  ctx.fill();

  // правая рука (основная на спусковом крючке)
  ctx.strokeStyle = "#2d5d3d";
  ctx.lineWidth = r * 0.32;
  ctx.beginPath();
  ctx.moveTo(r*0.75, -r*0.1);
  ctx.lineTo(r*0.6, -armReach*0.55);
  ctx.stroke();
  ctx.strokeStyle = "#3d7a4d";
  ctx.lineWidth = r * 0.26;
  ctx.beginPath();
  ctx.moveTo(r*0.6, -armReach*0.55);
  ctx.lineTo(r*0.2, -armReach*0.85);
  ctx.stroke();
  ctx.fillStyle = "#c8a888";
  ctx.beginPath();
  ctx.arc(r*0.2, -armReach*0.88, r*0.17, 0, Math.PI*2);
  ctx.fill();

  // ----- Оружие -----
  drawWeaponInHands(r, armReach);

  // ----- Голова -----
  const headR = r * 0.52;
  const headY = -r * 0.18;
  // волосы (тёмные, короткие)
  ctx.fillStyle = "#2a1f15";
  ctx.beginPath();
  ctx.arc(0, headY, headR * 1.02, 0, Math.PI*2);
  ctx.fill();
  // лицо
  const faceGrad = ctx.createRadialGradient(-headR*0.25, headY - headR*0.3, headR*0.1, 0, headY, headR);
  faceGrad.addColorStop(0, "#e8c8a8");
  faceGrad.addColorStop(0.6, "#c8a888");
  faceGrad.addColorStop(1, "#8a6a4a");
  ctx.fillStyle = faceGrad;
  ctx.beginPath();
  ctx.arc(0, headY, headR * 0.95, 0, Math.PI*2);
  ctx.fill();
  // тень под носом/бородой
  ctx.fillStyle = "rgba(60,40,30,0.35)";
  ctx.beginPath();
  ctx.ellipse(0, headY + headR*0.55, headR*0.7, headR*0.25, 0, 0, Math.PI*2);
  ctx.fill();

  // брови
  ctx.strokeStyle = "#2a1f15";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-headR*0.45, headY - headR*0.3);
  ctx.lineTo(-headR*0.15, headY - headR*0.35);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(headR*0.15, headY - headR*0.35);
  ctx.lineTo(headR*0.45, headY - headR*0.3);
  ctx.stroke();

  // глаза
  ctx.fillStyle = "#1a2a3a";
  ctx.beginPath();
  ctx.ellipse(-headR*0.32, headY - headR*0.05, headR*0.13, headR*0.16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(headR*0.32, headY - headR*0.05, headR*0.13, headR*0.16, 0, 0, Math.PI*2);
  ctx.fill();
  // блики в глазах
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.beginPath();
  ctx.arc(-headR*0.3, headY - headR*0.1, headR*0.05, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(headR*0.34, headY - headR*0.1, headR*0.05, 0, Math.PI*2);
  ctx.fill();

  // нос
  ctx.strokeStyle = "rgba(120,80,60,0.6)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, headY + headR*0.05);
  ctx.lineTo(0, headY + headR*0.25);
  ctx.stroke();

  // рот
  ctx.strokeStyle = "rgba(100,50,50,0.8)";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(0, headY + headR*0.35, headR*0.2, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // ----- Прицел (маленькая точка перед персонажем) -----
  ctx.fillStyle = "rgba(255,50,50,0.5)";
  ctx.beginPath();
  ctx.arc(0, -r*2.2, 1.5, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();

  // Бессмертие — аура
  if (godMode) {
    const aura = ctx.createRadialGradient(x, y, r*0.5, x, y, r*2.5);
    aura.addColorStop(0, "rgba(80,180,255,0)");
    aura.addColorStop(0.6, "rgba(80,180,255,0.15)");
    aura.addColorStop(1, "rgba(80,180,255,0)");
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(x, y, r*2.5, 0, Math.PI*2);
    ctx.fill();
    // пульсирующее кольцо
    const pulse = 1 + Math.sin(gameTime*3)*0.15;
    ctx.strokeStyle = `rgba(120,220,255,${0.4 + Math.sin(gameTime*3)*0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r*1.6*pulse, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawWeaponInHands(r, armReach) {
  const wIdx = currentWeaponIdx;
  if (wIdx === 0) {
    // Пистолет
    ctx.fillStyle = "#222";
    ctx.fillRect(-r*0.1, -armReach*1.15, r*0.2, r*0.5);
    ctx.fillStyle = "#333";
    ctx.fillRect(-r*0.08, -armReach*1.3, r*0.16, r*0.25);
    // дуло
    ctx.fillStyle = "#111";
    ctx.fillRect(-r*0.05, -armReach*1.35, r*0.1, r*0.1);
  } else if (wIdx === 1) {
    // Дробовик — длинный
    ctx.fillStyle = "#4a2a1a";
    ctx.fillRect(-r*0.15, -armReach*0.5, r*0.3, r*1.3); // приклад-ствол
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(-r*0.1, -armReach*1.5, r*0.2, r*0.6); // ствол
    // цевьё
    ctx.fillStyle = "#5a3a1a";
    ctx.fillRect(-r*0.13, -armReach*0.9, r*0.26, r*0.3);
  } else {
    // Пулемёт — массивный
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(-r*0.2, -armReach*0.6, r*0.4, r*1.4);
    ctx.fillStyle = "#111";
    ctx.fillRect(-r*0.12, -armReach*1.6, r*0.24, r*0.8);
    // магазин
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(-r*0.18, -armReach*0.3, r*0.2, r*0.5);
    // сошки
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r*0.15, -armReach*1.4);
    ctx.lineTo(-r*0.3, -armReach*1.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r*0.15, -armReach*1.4);
    ctx.lineTo(r*0.3, -armReach*1.6);
    ctx.stroke();
  }
}

/* ============================================================
   МИНИ-КАРТА
============================================================ */
function drawMinimap() {
  const mw = 110, mh = 110;
  const mx = VW - mw - 15;
  const my = 70;
  const scaleX = mw / CFG.worldW;
  const scaleY = mh / CFG.worldH;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(mx-2, my-2, mw+4, mh+4);
  ctx.fillStyle = "rgba(20,40,15,0.9)";
  ctx.fillRect(mx, my, mw, mh);
  for (const z of zombies) {
    ctx.fillStyle = "#ff3333";
    ctx.fillRect(mx + z.x*scaleX - 1, my + z.y*scaleY - 1, 3, 3);
  }
  ctx.fillStyle = godMode ? "#66ddff" : "#44aaff";
  ctx.beginPath();
  ctx.arc(mx + player.x*scaleX, my + player.y*scaleY, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = "rgba(120,200,120,0.4)";
  ctx.lineWidth = 1;
  ctx.strokeRect(mx, my, mw, mh);
  ctx.restore();
}

/* ============================================================
   ЦИКЛ
============================================================ */
let lastTime = 0;
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  if (gameRunning) update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   СТАРТ
============================================================ */
function init() {
  resize();
  generateWorld();
  resetGame();
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

document.getElementById("restartBtn").addEventListener("click", e => {
  e.stopPropagation();
  resetGame();
});
document.getElementById("gameOver").addEventListener("click", e => {
  if (e.target === e.currentTarget || e.target.id === "restartBtn") resetGame();
});

window.addEventListener("contextmenu", e => e.preventDefault());
init();
window.addEventListener("orientationchange", () => setTimeout(resize, 200));
</script>
