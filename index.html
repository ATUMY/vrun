<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Drive Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1017;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.game{width:100%;height:100vh;position:relative}
.top{position:absolute;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:16px;background:rgba(12,18,27,.9);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}
.title{font-weight:bold;font-size:17px}.status{color:#8fa2b8;font-size:13px}
.map{width:100%;height:100%;background:radial-gradient(circle at 50% 50%,#1b2a31 0%,#101820 55%,#080d13 100%)}
svg{width:100%;height:100%;display:block}
.road{fill:none;stroke:#344451;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.road-line{fill:none;stroke:#637383;stroke-width:2;stroke-dasharray:12 10;opacity:.7}
.small-road{fill:none;stroke:#273540;stroke-width:18;stroke-linecap:round}
.district{fill:rgba(255,255,255,.025);stroke:rgba(255,255,255,.05);stroke-width:2}
.district-name{fill:rgba(255,255,255,.45);font-size:18px;font-weight:bold}
#route{fill:none;stroke:#29a8ff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px rgba(41,168,255,.7));opacity:0}
.point{cursor:pointer}.point-circle{stroke:white;stroke-width:4}.point-label{fill:white;font-size:14px;font-weight:bold;pointer-events:none}
#car{filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
.panel{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;background:rgba(10,16,24,.94);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px;backdrop-filter:blur(15px)}
.route-info{display:flex;justify-content:space-between;margin-bottom:12px}
.location{font-size:14px;color:#aebccc}.location strong{display:block;color:white;font-size:16px;margin-top:3px}
.progress{height:7px;background:#26313c;border-radius:10px;overflow:hidden;margin-bottom:14px}
.progress-bar{height:100%;width:0%;background:#29a8ff;border-radius:10px}
.buttons{display:flex;gap:8px}
button{flex:1;min-height:46px;border:0;border-radius:13px;color:white;background:#17222d;font-size:14px;font-weight:bold;cursor:pointer}
button.primary{background:#1689e8}button:disabled{opacity:.4}
.hint{text-align:center;color:#8493a3;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="game">
<div class="top">
<div><div class="title">🏙️ Запорожье</div><div class="status" id="status">Выберите точку отправления</div></div>
<div>🚗 BMW 320</div>
</div>

<div class="map">
<svg viewBox="0 0 1000 700">
<rect class="district" x="30" y="80" width="290" height="250" rx="30"/>
<rect class="district" x="350" y="80" width="300" height="250" rx="30"/>
<rect class="district" x="680" y="80" width="280" height="250" rx="30"/>
<rect class="district" x="100" y="390" width="350" height="250" rx="30"/>
<rect class="district" x="520" y="390" width="360" height="250" rx="30"/>

<text class="district-name" x="90" y="125">Спальный район</text>
<text class="district-name" x="430" y="125">Центр</text>
<text class="district-name" x="750" y="125">Северный</text>
<text class="district-name" x="170" y="435">Промзона</text>
<text class="district-name" x="620" y="435">Порт</text>

<path class="road" d="M80 280 C220 280 280 200 430 220 C580 240 680 180 900 250"/>
<path class="road-line" d="M80 280 C220 280 280 200 430 220 C580 240 680 180 900 250"/>
<path class="road" d="M470 90 C470 180 450 250 460 350 C470 450 520 520 620 600"/>
<path class="road-line" d="M470 90 C470 180 450 250 460 350 C470 450 520 520 620 600"/>
<path class="road" d="M120 540 C270 480 390 500 500 520 C650 550 750 500 900 480"/>
<path class="road-line" d="M120 540 C270 480 390 500 500 520 C650 550 750 500 900 480"/>

<path class="small-road" d="M200 120 L200 280 L300 430"/>
<path class="small-road" d="M700 130 L650 250 L650 470"/>
<path class="small-road" d="M300 250 L300 520"/>

<path id="route" d="M0 0"/>

<g id="pointA" class="point" transform="translate(200,280)">
<circle class="point-circle" r="15" fill="#27d17f"/>
<circle r="25" fill="none" stroke="#27d17f" stroke-width="2" opacity=".5"/>
<text class="point-label" x="-12" y="-30">A</text>
</g>

<g id="pointB" class="point" transform="translate(650,470)">
<circle class="point-circle" r="15" fill="#ff4f64"/>
<circle r="25" fill="none" stroke="#ff4f64" stroke-width="2" opacity=".5"/>
<text class="point-label" x="-12" y="-30">B</text>
</g>

<g id="car" transform="translate(200,280)">
<rect x="-20" y="-11" width="40" height="22" rx="7" fill="#1689e8"/>
<rect x="-8" y="-8" width="16" height="16" rx="3" fill="#bfe8ff"/>
<circle cx="-13" cy="12" r="5" fill="#111"/>
<circle cx="13" cy="12" r="5" fill="#111"/>
<circle cx="-13" cy="-12" r="5" fill="#111"/>
<circle cx="13" cy="-12" r="5" fill="#111"/>
</g>
</svg>
</div>

<div class="panel">
<div class="route-info">
<div class="location">Откуда<strong id="from">—</strong></div>
<div style="text-align:right" class="location">Куда<strong id="to">—</strong></div>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="buttons">
<button id="buildRoute" class="primary">🗺️ Построить маршрут</button>
<button id="startDrive" disabled>🚗 Поехать</button>
<button id="reset">↻</button>
</div>
<div class="hint" id="hint">Сначала выберите точку A</div>
</div>
</div>

<script>
const pointA={x:200,y:280,name:"Спальный район"};
const pointB={x:650,y:470,name:"Порт"};

const route=document.getElementById("route");
const car=document.getElementById("car");
const fromText=document.getElementById("from");
const toText=document.getElementById("to");
const statusText=document.getElementById("status");
const hint=document.getElementById("hint");
const buildButton=document.getElementById("buildRoute");
const driveButton=document.getElementById("startDrive");
const resetButton=document.getElementById("reset");
const progressBar=document.getElementById("progressBar");

let routeReady=false;
let driving=false;
let animationFrame=null;

document.getElementById("pointA").addEventListener("click",()=>{
    if(driving)return;
    fromText.textContent=pointA.name;
    statusText.textContent="Точка A выбрана";
    hint.textContent="Теперь выберите точку B";
});

document.getElementById("pointB").addEventListener("click",()=>{
    if(driving)return;
    toText.textContent=pointB.name;
    statusText.textContent="Точка B выбрана";
    hint.textContent="Нажмите «Построить маршрут»";
});

buildButton.addEventListener("click",()=>{
    if(fromText.textContent==="—"||toText.textContent==="—"){
        hint.textContent="Сначала выберите A и B";
        return;
    }

    const routePath=`
        M 200 280
        C 280 240 350 215 460 225
        C 540 235 590 300 610 370
        C 625 420 640 450 650 470
    `;

    route.setAttribute("d",routePath);
    route.style.opacity="1";
    routeReady=true;
    driveButton.disabled=false;
    statusText.textContent="Маршрут построен";
    hint.textContent="Расстояние: 7.4 км • Время: ~2 мин";
});

driveButton.addEventListener("click",()=>{
    if(!routeReady||driving)return;

    driving=true;
    driveButton.disabled=true;
    buildButton.disabled=true;
    statusText.textContent="🚗 Машина едет...";
    hint.textContent="Следуем к точке B";

    const pathLength=route.getTotalLength();
    let startTime=null;
    const duration=10000;

    function drive(timestamp){
        if(!startTime)startTime=timestamp;

        let progress=(timestamp-startTime)/duration;
        if(progress>1)progress=1;

        const point=route.getPointAtLength(pathLength*progress);
        const nextProgress=Math.min(progress+0.01,1);
        const nextPoint=route.getPointAtLength(pathLength*nextProgress);

        const angle=Math.atan2(
            nextPoint.y-point.y,
            nextPoint.x-point.x
        )*180/Math.PI;

        car.setAttribute(
            "transform",
            `translate(${point.x} ${point.y}) rotate(${angle})`
        );

        progressBar.style.width=`${progress*100}%`;

        if(progress<1){
            animationFrame=requestAnimationFrame(drive);
        }else{
            finishDrive();
        }
    }

    animationFrame=requestAnimationFrame(drive);
});

function finishDrive(){
    driving=false;
    buildButton.disabled=false;
    statusText.textContent="📍 Вы прибыли";
    hint.textContent="Машина находится в Порту";
    progressBar.style.width="100%";
}

resetButton.addEventListener("click",()=>{
    if(animationFrame)cancelAnimationFrame(animationFrame);

    driving=false;
    routeReady=false;
    route.style.opacity="0";
    progressBar.style.width="0%";
    fromText.textContent="—";
    toText.textContent="—";
    statusText.textContent="Выберите точку отправления";
    hint.textContent="Сначала выберите точку A";
    buildButton.disabled=false;
    driveButton.disabled=true;
    car.setAttribute("transform","translate(200 280)");
});
</script>
</body>
</html>
